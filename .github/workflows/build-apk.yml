name: Build debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # Проект может лежать как в корне репозитория, так и в подпапке ChewPlay.
      - name: Find project directory
        id: project
        run: |
          settings=$(find . -maxdepth 3 -name settings.gradle.kts -not -path '*/build/*' | head -n 1)
          if [ -z "$settings" ]; then
            echo "::error::settings.gradle.kts не найден в репозитории"
            exit 1
          fi
          dir=$(dirname "$settings")
          dir=${dir#./}
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Каталог проекта: $dir"

      - name: Ensure Android SDK 34
        continue-on-error: true
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" || true

      - name: Unit tests (не блокируют сборку APK)
        continue-on-error: true
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chewplay-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
